<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password — Crygle Academy</title>
  <meta name="description" content="Reset password akun Crygle Academy kamu. Masukkan email terdaftar untuk menerima instruksi reset kata sandi.">
  <link rel="icon" type="image/png" href="icon/logo.png">
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/main.css?v=3.5">
  <link rel="stylesheet" href="styles/components.css?v=3.5">
  <link rel="stylesheet" href="styles/auth.css?v=1.0">
</head>
<body>

  <div class="auth-page-container">

    <!-- LEFT COLUMN: ILLUSTRATIONS (sama seperti Login/Signup, Figma Node 735:4450 family) -->
    <aside class="auth-illustration-col" aria-label="Crygle Academy Showcase">
      <div class="auth-illus-top-wrap">
        <img src="icon/Design 1 login page.svg" alt="Crygle Academy Digital Learning Illustration" class="auth-illus-top-img">
      </div>
      <div class="auth-illus-bottom-wrap">
        <img src="icon/Design Bawah Login.svg" alt="Pilar Pembelajaran: Robotic, Coding, dan UI/UX Design" class="auth-illus-bottom-img">
      </div>
    </aside>

    <!-- RIGHT COLUMN: FORGOT PASSWORD FORM -->
    <main class="auth-form-col">
      <div class="auth-form-wrapper">

        <a href="index.html" class="auth-brand-header" aria-label="Kembali ke Beranda Crygle Academy">
          <img src="icon/logo.png" alt="Crygle Academy" class="auth-brand-logo">
        </a>

        <!-- STATE 1: Form Input Email -->
        <div id="forgot-password-request-state">
          <div class="auth-heading-group">
            <h1 class="auth-heading-title">Lupa Password</h1>
            <p class="auth-heading-subtitle">Masukkan email akun kamu — kami kirimkan link untuk membuat password baru</p>
          </div>

          <form class="auth-form-body" id="forgot-password-form">
            <div class="auth-input-box">
              <label class="auth-input-label" for="forgot-email">Alamat Email</label>
              <div class="auth-input-control-wrap">
                <input
                  type="email"
                  id="forgot-email"
                  name="email"
                  class="auth-input-field"
                  placeholder="nama@email.com"
                  required
                  autocomplete="email">
              </div>
            </div>

            <button type="submit" class="auth-btn-primary" id="btn-submit-forgot-password">
              <span>Kirim Link Reset</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"></path>
                <path d="m12 5 7 7-7 7"></path>
              </svg>
            </button>

            <p class="auth-footer-switch">
              Ingat password kamu? Silahkan
              <a href="login.html" class="auth-footer-switch-link">Masuk</a>
            </p>
          </form>
        </div>

        <!-- STATE 2: Konfirmasi Terkirim (hidden by default, JS toggles) -->
        <div id="forgot-password-sent-state" style="display: none;">
          <div class="auth-heading-group">
            <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--color-success-bg); color: var(--color-success); display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </div>
            <h1 class="auth-heading-title">Cek Email Kamu</h1>
            <p class="auth-heading-subtitle">
              Link reset password sudah dikirim ke <strong id="forgot-email-display">email kamu</strong>. Cek folder inbox atau spam.
            </p>
          </div>

          <button type="button" class="auth-btn-google" id="btn-resend-forgot-password" style="margin-bottom: 16px;">
            <span>Kirim Ulang Email</span>
          </button>

          <p class="auth-footer-switch">
            <a href="login.html" class="auth-footer-switch-link">← Kembali ke halaman Masuk</a>
          </p>
        </div>

      </div>
    </main>

  </div>

  <div id="toast-notification-container"></div>

  <script src="scripts/main.js"></script>
</body>
</html>
