<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;background:var(--white)}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Input, Checkbox } = window.CRYGLEAcademyDesignSystem_d21a7f;
function Demo(){
  const [a,setA]=React.useState(true); const [b,setB]=React.useState(false);
  return <div style={{display:'flex',gap:24}}>
    <div style={{width:320,display:'flex',flexDirection:'column',gap:16}}>
      <Input label="Alamat Email" defaultValue="dionahza@crygleacademy.com" />
      <Input label="Password" type="password" defaultValue="••••••••••" />
    </div>
    <div style={{width:280,display:'flex',flexDirection:'column',gap:16}}>
      <Input label="Nomor Kartu" placeholder="0000 0000 0000 0000" status="error" />
      <Checkbox label="Ingatkan Saya" checked={a} onChange={e=>setA(e.target.checked)} />
      <Checkbox label="Belum dicentang" checked={b} onChange={e=>setB(e.target.checked)} />
      <Checkbox label="Tidak aktif" checked disabled />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
